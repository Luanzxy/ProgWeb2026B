{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <div class="row">
            <h5 class="col-md-2">ID</h5>
            <input value="{{ categoria.id }}" readonly>
        </div>
        <div class="row mt-2">
            <h5 class="col-md-2">Categoria</h5>
            <input value="{{ categoria.Categoria }}" readonly>
        </div>
        <div class="row">
            <a href="{% url 'categorias' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
