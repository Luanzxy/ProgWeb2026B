{% extends "base.html" %}
{% load static %}
{% block title %}Início{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock %}
{% block content %}
<div id="content">
    <div class="container">
        <form method="POST" action="/categoria/edit">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ categoria.id }}">
            <div class="row">
                <h5 for="Categoria" class="col-md-2">Categoria</h5>
                <input name="Categoria" value="{{ categoria.Categoria }}" required>
            </div>
            <div class="row">
                <button type="submit" class="btn btn-danger col-md-2 mt-3 mr-2"><i class="fa fa-save"></i> Salvar</button>
                <a href="{% url 'categorias' %}" class="btn bg-secondary col-md-2 mt-3"><i class="fa fa-rotate-left"></i> Retornar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/home.js' %}"></script>
{% endblock %}
